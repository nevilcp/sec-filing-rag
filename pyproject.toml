[build-system]
requires = ["setuptools==75.1.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-financial-compliance-rag"
version = "0.1.0"
description = "Production-grade SEC Financial Compliance RAG system scaffold"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.2.16",
  "langgraph>=0.2.34",
  "langchain-google-genai>=1.0.10",
  "pypdf>=4.3.1",
  "fastapi>=0.135.2",
  "uvicorn>=0.30.6",
  "presidio-analyzer>=2.2.355",
  "presidio-anonymizer>=2.2.355",
  "ragas>=0.1.21",
  "tenacity>=8.5.0",
  "pydantic>=2.12",
  "qdrant-client>=1.18.0",
  "bm25s>=0.3.9",
  "FlagEmbedding>=1.4.0",
  "gradio>=6.14.0",
  "arize-phoenix>=15.9.0",
  "openinference-instrumentation-langchain>=0.1.64",
  "httpx>=0.28.1",
  "beautifulsoup4>=4.14.3",
  "lxml>=6.1.0",
  "langchain-groq>=1.1.2",
  "python-dotenv>=1.2.2",
  "opentelemetry-api>=1.42.0",
  "pytest>=9.0.3",
  "ruff>=0.4.0",
]

[project.scripts]
ingest    = "src.rag.ingest:main"
api       = "src.api.run:main"
evaluate  = "src.eval.run_phoenix_evals:main"
gradio    = "app.gradio_app:main"
phoenix   = "src.api.run:run_phoenix"
[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*", "tests*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/api/main.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
