[build-system]
requires = ["setuptools==75.1.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-financial-compliance-rag"
version = "0.1.0"
description = "Production-grade SEC Financial Compliance RAG system scaffold"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.2.16",
  "langgraph>=0.2.34",
  "langchain-text-splitters>=0.3.0",
  "langchain-google-genai>=1.0.10",
  "fastapi>=0.135.2",
  "uvicorn>=0.30.6",
  "presidio-analyzer>=2.2.355",
  "presidio-anonymizer>=2.2.355",
  "tenacity>=8.5.0",
  "pydantic>=2.12",
  "qdrant-client>=1.18.0",
  "bm25s>=0.3.9",
  "FlagEmbedding>=1.4.0",
  "gradio>=6.14.0",
  "arize-phoenix>=15.9.0",
  "openinference-instrumentation-langchain>=0.1.64",
  "httpx>=0.28.1",
  "beautifulsoup4>=4.14.3",
  "lxml>=6.1.0",
  "langchain-groq>=1.1.2",
  "python-dotenv>=1.2.2",
  "opentelemetry-api>=1.42.0",
  "opentelemetry-sdk>=1.42.0",
  "openinference-semantic-conventions>=0.1.43",
  "sentence-transformers>=3.0.0",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.4.0",
]

[project.scripts]
ingest    = "src.rag.ingest:main"
api       = "src.api.run:main"
evaluate  = "src.eval.run_phoenix_evals:main"
gradio    = "app.gradio_app:main"
phoenix   = "src.api.run:run_phoenix"
[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "D", "W505", "RUF002", "RUF003"]
# Explicit ignores instead of convention="google": the preset disables D401 (imperative mood).
ignore = ["E501", "D203", "D213", "D105", "D107", "D406", "D407", "D408", "D409", "D413", "D415"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.per-file-ignores]
"src/api/main.py" = ["E402"]
"tests/*" = ["D103"]

[tool.ruff.format]
quote-style = "double"
